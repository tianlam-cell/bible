<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>生命讀經導覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2EC; --paper:#FFFFFF; --ink:#1F3A2E; --text:#1C2420; --muted:#617066;
  --gold:#A8812A; --line:#CFD8CC; --track:#DDE4DA;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131A16; --paper:#1B241F; --ink:#CFE3D4; --text:#E4EBE5; --muted:#93A399;
    --gold:#D6AE52; --line:#2C3A32; --track:#26322B;
  }
}
:root[data-theme="dark"]{
  --bg:#131A16; --paper:#1B241F; --ink:#CFE3D4; --text:#E4EBE5; --muted:#93A399;
  --gold:#D6AE52; --line:#2C3A32; --track:#26322B;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei","Songti TC",serif;line-height:1.7}
.wrap{max-width:1040px;margin:0 auto;padding:40px 20px 80px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;
  border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:36px}
h1{font-weight:900;font-size:clamp(2.2rem,6vw,3.6rem);color:var(--ink);margin:0;line-height:1.1;letter-spacing:.04em}
.sub{color:var(--muted);margin:6px 0 0;font-size:.95rem}
.overall{text-align:right;min-width:180px}
.overall b{font-size:2rem;color:var(--gold);font-weight:900}
.overall span{display:block;color:var(--muted);font-size:.85rem}
.resume{margin:-16px 0 32px;font-size:.95rem;color:var(--muted);min-height:1.5em}
.resume button{font:inherit;color:var(--ink);background:none;border:none;border-bottom:1px solid var(--gold);padding:0;cursor:pointer}
h2{font-size:1.25rem;color:var(--ink);margin:40px 0 14px;font-weight:600}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.book{position:relative;text-align:left;font:inherit;color:var(--text);background:var(--paper);
  border:1px solid var(--line);border-left:5px solid var(--ink);padding:12px 12px 16px;cursor:pointer;border-radius:3px}
.book:hover{border-color:var(--gold);border-left-color:var(--gold)}
.book:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.book .name{font-weight:600;font-size:1.05rem}
.book .meta{font-size:.8rem;color:var(--muted)}
.book .bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--track)}
.book .bar i{display:block;height:100%;background:var(--gold);width:0}
.book.done{border-left-color:var(--gold)}
.book.done .name::after{content:" ✓";color:var(--gold)}
/* panel */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
aside{position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:var(--paper);
  border-left:2px solid var(--ink);transform:translateX(100%);transition:transform .25s ease;
  padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto}
aside.show{transform:none}
@media (prefers-reduced-motion:reduce){aside,.scrim{transition:none}}
aside h3{font-size:1.8rem;color:var(--ink);margin:0 0 4px;font-weight:900}
.close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;font-size:1.6rem;background:none;border:none;color:var(--muted);cursor:pointer}
.open-link{display:block;text-align:center;margin:20px 0 28px;padding:14px;background:var(--ink);color:var(--paper);
  text-decoration:none;font-weight:600;border-radius:3px}
label{display:block;font-weight:600;color:var(--ink);margin:18px 0 6px}
.hint{font-size:.8rem;color:var(--muted);font-weight:400}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=number]{width:90px}
input,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);padding:8px 10px;border-radius:3px}
textarea{width:100%;min-height:160px;resize:vertical}
.btn{font:inherit;background:none;border:1px solid var(--ink);color:var(--ink);padding:7px 14px;border-radius:3px;cursor:pointer}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.saved{font-size:.8rem;color:var(--muted);min-height:1.2em;margin-top:6px}
footer{margin-top:60px;font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
footer a{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>生命讀經導覽</h1>
      <p class="sub">揀一卷書，開官網原文閱讀，並記下自己讀到邊篇。</p>
    </div>
    <div class="overall"><b id="doneCount">0</b> / <span style="display:inline" id="total"></span>
      <span>卷已讀完</span></div>
  </header>
  <p class="resume" id="resume"></p>

  <h2>舊約生命讀經</h2>
  <div class="shelf" id="ot"></div>
  <h2>新約生命讀經</h2>
  <div class="shelf" id="nt"></div>

  <footer>
    所有生命讀經內容均屬水流職事站所有，本頁只提供連結及個人閱讀記錄。原文請至
    <a href="https://lsmchinese.org/lifestudy/index.html" target="_blank" rel="noopener">lsmchinese.org</a> 閱讀。
    閱讀記錄只儲存在你自己的瀏覽器。
  </footer>
</div>

<div class="scrim" id="scrim"></div>
<aside id="panel" aria-hidden="true" role="dialog" aria-labelledby="pTitle">
  <button class="close" id="close" aria-label="關閉">×</button>
  <h3 id="pTitle"></h3>
  <div class="hint" id="pMeta"></div>
  <a class="open-link" id="pLink" target="_blank" rel="noopener">打開官網篇目</a>

  <label for="pAt">讀到第幾篇 <span class="hint">（輸入篇數）</span></label>
  <div class="row">
    <button class="btn" id="minus" aria-label="減一篇">−</button>
    <input type="number" id="pAt" min="0" step="1">
    <button class="btn" id="plus" aria-label="加一篇">＋</button>
  </div>

  <label>狀態</label>
  <div class="row">
    <button class="btn gold" id="pDone"></button>
  </div>

  <label for="pNote">我的筆記</label>
  <textarea id="pNote" placeholder="寫低讀經時嘅亮光、問題或者禱告…"></textarea>
  <div class="saved" id="saved"></div>
</aside>

<script>
const B="https://lsmchinese.org/lifestudy/";
const OT=[["創世記","ot/gen"],["出埃及記","ot/exo"],["利未記","ot/lev"],["民數記","ot/num"],["申命記","ot/deu"],["約書亞記","ot/jos"],["士師記","ot/jud"],["路得記","ot/ruth"],["撒母耳記","ot/sam"],["列王紀","ot/king"],["歷代志","ot/chr"],["以斯拉記","ot/ezr"],["尼希米記","ot/neh"],["以斯帖記","ot/est"],["約伯記","ot/job"],["詩篇","ot/psa"],["箴言","ot/pro"],["傳道書","ot/ecc"],["雅歌","ot/song"],["以賽亞書","ot/isa"],["耶利米書","ot/jer"],["耶利米哀歌","ot/lam"],["以西結書","ot/eze"],["但以理書","ot/dan"],["何西阿書","ot/hos"],["約珥書","ot/joe"],["阿摩司書","ot/amos"],["俄巴底亞書","ot/oba"],["約拿書","ot/jona"],["彌迦書","ot/mich"],["那鴻書","ot/nahu"],["哈巴谷書","ot/haba"],["西番雅書","ot/zeph"],["哈該書","ot/hag"],["撒迦利亞書","ot/zech"],["瑪拉基書","ot/mala"]];
const NT=[["馬太福音","matt"],["馬可福音","mark"],["路加福音","luke"],["約翰福音","john"],["使徒行傳","acts"],["羅馬書","roma"],["哥林多前書","1cor"],["哥林多後書","2cor"],["加拉太書","gal"],["以弗所書","ephi"],["腓立比書","phil"],["歌羅西書","col"],["帖撒羅尼迦前書","1the"],["帖撒羅尼迦後書","2the"],["提摩太前書","1tim"],["提摩太後書","2tim"],["提多書","titu"],["腓利門書","phmn"],["希伯來書","hebr"],["雅各書","jame"],["彼得前書","1pet"],["彼得後書","2pet"],["約翰壹書","1joh"],["約翰貳書","2joh"],["約翰參書","3joh"],["猶大書","juda"],["啟示錄","rev"]];
const KEY="lifestudy-nav-v1";
let data={books:{},last:null};
try{const s=localStorage.getItem(KEY);if(s)data=Object.assign(data,JSON.parse(s));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){return false}}
const st=id=>data.books[id]||(data.books[id]={at:0,done:false,note:""});

function card(name,id){
  const b=document.createElement("button");b.className="book";b.dataset.id=id;
  b.innerHTML=`<div class="name">${name}</div><div class="meta"></div><div class="bar"><i></i></div>`;
  b.onclick=()=>openPanel(name,id);return b;
}
function refresh(){
  let done=0;
  document.querySelectorAll(".book").forEach(el=>{
    const s=data.books[el.dataset.id];
    const d=s&&s.done, at=s?s.at:0;
    if(d)done++;
    el.classList.toggle("done",!!d);
    el.querySelector(".meta").textContent=d?"已讀完":(at?`讀到第${at}篇`:"未開始");
    el.querySelector(".bar i").style.width=d?"100%":(at?"30%":"0");
  });
  document.getElementById("doneCount").textContent=done;
  const r=document.getElementById("resume");r.innerHTML="";
  if(data.last){
    const all=[...OT,...NT].find(x=>x[1]===data.last);
    if(all){const s=st(all[1]);
      r.append("上次讀到：");
      const btn=document.createElement("button");
      btn.textContent=`${all[0]}${s.at?` 第${s.at}篇`:""}`;
      btn.onclick=()=>openPanel(all[0],all[1]);r.append(btn);}
  }
}
const ot=document.getElementById("ot"),nt=document.getElementById("nt");
OT.forEach(([n,i])=>ot.append(card(n,i)));NT.forEach(([n,i])=>nt.append(card(n,i)));
document.getElementById("total").textContent=OT.length+NT.length;

const panel=document.getElementById("panel"),scrim=document.getElementById("scrim");
const pAt=document.getElementById("pAt"),pNote=document.getElementById("pNote"),pDone=document.getElementById("pDone"),saved=document.getElementById("saved");
let cur=null,lastFocus=null;
function openPanel(name,id){
  cur=id;lastFocus=document.activeElement;
  const s=st(id);
  document.getElementById("pTitle").textContent=name;
  document.getElementById("pMeta").textContent=OT.some(x=>x[1]===id)?"舊約生命讀經":"新約生命讀經";
  document.getElementById("pLink").href=B+id+"-idx.html";
  pAt.value=s.at||"";pNote.value=s.note||"";setDone(s.done);saved.textContent="";
  panel.classList.add("show");scrim.classList.add("show");panel.setAttribute("aria-hidden","false");
  document.getElementById("close").focus();
}
function closePanel(){panel.classList.remove("show");scrim.classList.remove("show");panel.setAttribute("aria-hidden","true");if(lastFocus)lastFocus.focus();}
function setDone(d){pDone.textContent=d?"已讀完（撳一下取消）":"標記為已讀完";}
function commit(){
  if(!cur)return;const s=st(cur);
  s.at=Math.max(0,parseInt(pAt.value)||0);s.note=pNote.value;data.last=cur;
  saved.textContent=save()?"已儲存":"未能儲存（瀏覽器唔允許儲存）";refresh();
}
pAt.oninput=commit;
let t;pNote.oninput=()=>{clearTimeout(t);t=setTimeout(commit,400)};
document.getElementById("plus").onclick=()=>{pAt.value=(parseInt(pAt.value)||0)+1;commit()};
document.getElementById("minus").onclick=()=>{pAt.value=Math.max(0,(parseInt(pAt.value)||0)-1);commit()};
pDone.onclick=()=>{const s=st(cur);s.done=!s.done;setDone(s.done);commit()};
document.getElementById("close").onclick=closePanel;scrim.onclick=closePanel;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&panel.classList.contains("show"))closePanel()});
refresh();
</script>
</body>
</html>
